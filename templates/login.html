<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Sanjeevani AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f2e9;
            color: #173f3a;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #20584f;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-family: Georgia, serif;
        }

        .subtitle {
            text-align: center;
            color: #687b78;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d5dcd9;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #20584f;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #20584f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #17463f;
        }

        .error {
            background: #ffe8e8;
            color: #a33a3a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
        }

        .signup-link a {
            color: #20584f;
            font-weight: bold;
            text-decoration: none;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="logo">
            <div class="logo-icon">
                ♥
            </div>
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your Sanjeevani AI account
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST" action="/login">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-link">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
